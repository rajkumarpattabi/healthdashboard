<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3f8ff0"/>
      <stop offset="0.55" stop-color="#2a78d6"/>
      <stop offset="1" stop-color="#12a37a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.32" cy="0.26" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="heart" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eaf3ff"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0a2a55" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- full-bleed opaque background (iOS masks corners itself) -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glow)"/>

  <!-- heart -->
  <path filter="url(#soft)" fill="url(#heart)" d="
    M256 402
    C 256 402, 108 302, 108 218
    C 108 168, 149 138, 195 138
    C 226 138, 251 159, 256 184
    C 261 159, 286 138, 317 138
    C 363 138, 404 168, 404 218
    C 404 302, 256 402, 256 402 Z"/>

  <!-- ECG / trend pulse cutting across the heart -->
  <polyline fill="none" stroke="#1f66c8" stroke-width="20"
    stroke-linecap="round" stroke-linejoin="round"
    points="132,266 190,266 214,266 236,300 258,182 282,322 302,266 380,266"/>
  <!-- small end node to hint 'latest reading' -->
  <circle cx="380" cy="266" r="13" fill="#12a37a" stroke="#ffffff" stroke-width="6"/>
</svg>
